services:
  web:
    build: .
    restart: unless-stopped
    mem_limit: 400m
    env_file: .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 80m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
